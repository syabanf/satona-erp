<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/satona-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f0f1" />
    <title>Satona ERP</title>
    <script>
      // Light is the default; apply a saved dark choice before first paint so it never flashes.
      try {
        if (localStorage.getItem('satona-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
        // Large text and transaction codes are per-viewer comfort settings, applied before paint too.
        if (localStorage.getItem('satona-text') === 'large') document.documentElement.dataset.text = 'large'
        if (localStorage.getItem('satona-codes') === 'show') document.documentElement.dataset.codes = 'show'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
